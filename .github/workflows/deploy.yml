name: FocusBoard Staging & Production Deployment

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || inputs.target_env == 'staging'
    environment:
      name: staging
      url: https://staging.focusboard.app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Staging Deployment Steps
        run: |
          echo "[Deploy] Packaging artifacts for staging environment..."
          echo "[Deploy] Setting DATABASE_URL and SECRET_KEY for staging..."
          echo "[Deploy] Staging deployment completed."

      - name: Run Post-Deployment Smoke Tests
        run: |
          echo "[Smoke] Verifying staging health and readiness probes..."
          # python scripts/smoke_test.py --backend-url https://api-staging.focusboard.app --frontend-url https://staging.focusboard.app

  deploy-production:
    name: Controlled Production Release Gate
    runs-on: ubuntu-latest
    needs: [ deploy-staging ]
    if: inputs.target_env == 'production'
    environment:
      name: production
      url: https://app.focusboard.app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Production Application
        run: |
          echo "[Production] Explicit manual authorization approved."
          echo "[Production] Running database migrations on production cluster..."
          echo "[Production] Rolling update of backend and frontend containers..."

      - name: Execute Production Smoke Tests
        run: |
          echo "[Smoke] Validating production endpoints..."
          # python scripts/smoke_test.py --backend-url https://api.focusboard.app --frontend-url https://app.focusboard.app
